<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <title>Peta Sebaran Aloptama Meteorologi</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/map.css">
    <style>
        #header-theme-toggle {
            display: none !important;
        }
    </style>
</head>
<body>

    <header include-html="/_header.html"></header>
    
    <div id="map"></div>

    <div class="map-summary-card">
        <h6 class="summary-title">Status</h6>
        
        <div class="summary-row">
            <span>Total Site</span>
            <span id="count-total" class="badge-pill bg-primary">0</span>
        </div>
        
        <div id="btn-filter-green" class="summary-row text-success clickable-row">
            <span><span class="dot bg-success"></span> Online (< 12h)</span>
            <span id="count-green" class="fw-bold">0</span>
        </div>

        <div id="btn-filter-yellow" class="summary-row text-warning clickable-row">
            <span><span class="dot bg-warning"></span> Warning (< 24h)</span>
            <span id="count-yellow" class="fw-bold">0</span>
        </div>

        <div id="btn-filter-red" class="summary-row text-danger clickable-row">
            <span><span class="dot bg-danger"></span> Offline (> 24h)</span>
            <span id="count-red" class="fw-bold">0</span>
        </div>
    </div>

    <div id="station-list-modal" class="station-list-modal" style="display: none;">
        <div class="modal-header-custom">
            <h6 id="list-title" class="mb-0 fw-bold">Daftar Offline</h6>
            <button id="close-list-btn" class="btn-close-custom">&times;</button>
        </div>
        <div class="modal-body-custom">
            <ul id="station-list-ul" class="list-group list-group-flush">
                </ul>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/js/layout.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/map.js"></script>
</body>
</html>
