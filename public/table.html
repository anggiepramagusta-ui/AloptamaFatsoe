<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <title>Tabel Data Cuaca</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/theme.css"> 
    
    <link rel="stylesheet" href="/css/table.css">
</head>
<body>
    <header include-html="/_header.html"></header>

    <div class="container my-4">
        <div class="mb-4 text-center">
            <h1 id="table-title" class="fw-bold">Weather Data Table</h1>
            <p id="station-subtitle" class="lead text-muted mb-0">Memuat data stasiun...</p>
        </div>

        <div class="filter-controls justify-content-center">
            <div class="control-group">
                <label for="startTime">Waktu Mulai:</label>
                <input type="datetime-local" id="startTime" class="form-control">
            </div>
            <div class="control-group">
                <label for="endTime">Waktu Selesai:</label>
                <input type="datetime-local" id="endTime" class="form-control">
            </div>
            <button id="fetchDataBtn" class="btn btn-primary d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Tampilkan Data
            </button>
            <button id="exportDataBtn" class="btn btn-success d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Ekspor CSV
            </button> 
        </div>

        <div id="dataCompletenessContainer" class="mt-3"></div>

        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead id="tableHeader"></thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>

            <div class="pagination-footer mt-3 pt-3 border-top">
                <div id="paginationInfo" class="pagination-info text-muted"></div>
                <nav>
                    <ul class="pagination mb-0" id="paginationControls"></ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/table.js"></script>
</body>
</html>
