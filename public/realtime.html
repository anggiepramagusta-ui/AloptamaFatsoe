<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Real-time Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/realtime.css">
</head>
<body>
    <header include-html="/_header.html"></header>

    <div class="container-fluid my-4 px-4">
        
        <div id="dashboard-header" class="text-center">
            <h1 id="dashboard-title">Dashboard Real-time</h1>
            <p id="station-subtitle" class="lead text-muted">Memuat data stasiun...</p>
            
            <div class="mt-3 d-flex justify-content-center gap-2">
                <button id="toggle-drag-btn" class="btn btn-sm btn-outline-primary">
                    Kunci Posisi Kartu
                </button>
            </div>
        </div>
        
        <div class="row g-4 mt-3">
            <div class="col-lg-4 col-md-12" id="wind-card-container"></div>

            <div class="col-lg-8 col-md-12 d-flex flex-column">
                <div class="row g-4" id="eight-card-layout" style="display: none;">
                    <div class="col-6">
                        <div class="row g-4" id="eight-card-left-col"></div>
                    </div>
                    <div class="col-6">
                        <div class="row g-4" id="eight-card-right-col"></div>
                    </div>
                </div>

                <div class="row g-4 flex-grow-1" id="default-cards-container"></div>
            </div>
        </div>

        <div class="d-flex justify-content-center align-items-center mt-4 gap-2">
            <div id="live-indicator" class="status-dot" title="Menunggu Koneksi..."></div>
            <p class="text-muted mb-0">
                Last Update: <span id="last-update">--</span>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="/js/layout.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/realtime.js"></script>
</body>
</html>
