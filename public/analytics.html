<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Weather Analytics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css"> <link rel="stylesheet" href="/css/analytics.css">
</head>
<body>
    <header include-html="/_header.html"></header>

    <div class="container-fluid my-4 px-4">
        <div class="mb-4 text-center">
            <h1 id="analytics-title">Weather Analytics</h1>
            <p id="station-subtitle" class="lead text-muted mb-0">Memuat data stasiun...</p>
        </div>
        
        <div class="filter-controls justify-content-center mb-4">
            <div class="control-group">
                <label for="startTime">Waktu Mulai (UTC):</label>
                <input type="datetime-local" id="startTime" class="form-control">
            </div>
            <div class="control-group">
                <label for="endTime">Waktu Selesai (UTC):</label>
                <input type="datetime-local" id="endTime" class="form-control">
            </div>
            <button id="fetchDataBtn" class="btn btn-primary d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Tampilkan Grafik
            </button>
        </div>

        <div id="charts-grid" class="row g-4">
            <div class="col-12 text-center text-muted py-5">
                Silakan pilih rentang waktu dan klik tombol tampilkan.
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/analytics.js"></script>
</body>
</html>
